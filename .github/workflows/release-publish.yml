name: Publish release (Windows)

# Phase 4 正式发布（Windows 常规通道）。
#
# 只做一件事：把**已存在的 Draft** 变成公开 Release，且必须先通过人工审批
# （Environment `release-windows` 的 required reviewer）与发布前绑定校验。
#
# 强制门禁：
# - 候选必须是 Draft（不是别的通道的 Release，也不是已发布的 Release）；
# - 版本标签必须已由维护者在本轮授权后创建，且解引用后指向 Draft 的候选提交；
#   本工作流不会创建/推送标签，也不得用 GITHUB_TOKEN 绕过标签保护规则；
# - 必须存在 RC 记录 `rc-record.json`，且其中每个制品的 SHA-256 与**实际下载到的
#   制品**一致（审批后替换制品会被拒绝）；
# - 必须存在干净 Windows VM 的安装验证回执 `install-verification.json`，
#   且其版本 / Commit / 平台 / 安装包摘要与候选完全一致；
# - 公开更新清单必须结构合法且含本通道平台项。
#
# 状态模型（与 Linux 通道一致）：
#   published    = Release 是否已公开
#   need_publish = 仍需公开（Draft）
#   need_handoff = 仍缺**另一通道清单**（已公开也可能缺）
#   need_verify  = 永远校验（公开状态 + 两个清单都要能下载）
# 由 `scripts/release-governance/publish-state.mjs` 判定，工作流只按判定执行。
#
# 部分失败恢复（人工）：
#   1) 直接重跑本工作流（同一 tag）。已公开不会再次公开，只会补 missing 清单；
#   2) 若接力仍失败，先确认另一通道存在**已公开**的 Release 且含对应清单，
#      再重跑；不得手工上传未审批的清单；
#   3) 两条清单齐备前，工作流保持红色，不要手工改 `latest*` 资产来"凑绿"。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "待发布的候选标签（vX.Y.Z）"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-publish-windows-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify binding → publish Draft (Windows)
    runs-on: windows-2022
    # 人工审批门禁（Environment 需维护者配置 required reviewer）。
    environment: release-windows
    permissions:
      contents: write # 仅用于发布 Draft、接力通道清单与发布后校验
      actions: read # 读取 run 审批记录与安装证据 provenance
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # 候选 Draft 可以没有版本标签；正式发布阶段则必须已有维护者在**本轮授权后**
      # 创建的标签。工作流不得用 GITHUB_TOKEN 建标签，也不得改保护规则或扩权。
      - name: Checkout trusted main tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release identity from Draft
        id: identity
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if printf '%s' "$TAG" | grep -q "rehearsal"; then
            echo "演练标签永远不得发布：$TAG" >&2
            exit 1
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "标签必须形如 vX.Y.Z（常规通道不带 -linux 后缀）：$TAG" >&2
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          rm -rf release-meta && mkdir -p release-meta
          if ! gh release view "$TAG" --json isDraft,tagName,targetCommitish > release-meta/release.json 2>release-meta/release.err; then
            echo "找不到 Release $TAG：必须先由 release-candidate 工作流创建 Draft" >&2
            sed -n '1,5p' release-meta/release.err >&2 || true
            exit 1
          fi
          if ! gh release download "$TAG" --pattern rc-record.json --dir release-meta --clobber; then
            echo "Draft 缺少 rc-record.json：无法解析候选提交，拒绝发布" >&2
            exit 1
          fi
          # 候选提交来自 Draft 的 RC 记录，并由标签、main 归属和 target_commitish 三方复核。
          # 这里不检出输入标签：标签在候选阶段可能尚不存在，且检出动作不应成为信任来源。
          node scripts/release-governance/publish-identity.mjs \
            --tag "$TAG" \
            --channel windows \
            --release-json release-meta/release.json \
            --record release-meta/rc-record.json \
            --out release-meta/identity.json
          COMMIT="$(node -p 'JSON.parse(require("node:fs").readFileSync("release-meta/identity.json","utf8")).commit')"
          VERSION="$(node -p 'JSON.parse(require("node:fs").readFileSync("release-meta/identity.json","utf8")).version')"
          git checkout --detach "$COMMIT"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "v${PACKAGE_VERSION}" != "v${VERSION}" ]; then
            echo "候选提交 $COMMIT 的 package.json 版本 v${PACKAGE_VERSION} 与 RC 记录 v${VERSION} 不一致" >&2
            exit 1
          fi
          echo "commit=${COMMIT}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      # 发布门禁必须用**当前 main 上的治理脚本**执行，而不是标签提交里的旧副本。
      # 1) 门禁是「工具」：候选身份由 tag / commit / 平台 / 每个制品 SHA-256 单独绑定，
      #    工具版本不参与候选身份；
      # 2) 候选创建之后若治理脚本修过缺陷（例如回执契约统一），标签里的旧副本会让
      #    正式发布**必然失败**——只剩「绕过门禁」一条路可走，与「缺证据即拒绝」的
      #    设计目标正好相反；
      # 3) main 受保护（PR + CI + PR 治理门禁），门禁脚本的每次改动都经过评审。
      - name: Use current release-gate tooling from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git checkout FETCH_HEAD -- scripts/
          echo "发布门禁脚本已对齐 main（$(git rev-parse --short FETCH_HEAD)）"

      # ---------- 发布状态 ----------
      # 「已公开」与「清单齐全」是两个独立状态：已公开但缺另一通道清单时，
      # 重跑必须继续补清单，而不是把 isDraft=false 当作"幂等完成"。
      - name: Assess publication state
        id: state
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.identity.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --json isDraft,assets > release-state.json 2>/dev/null; then
            echo "找不到 Release $TAG：必须先由 release-candidate 工作流创建 Draft" >&2
            exit 1
          fi
          node scripts/release-governance/publish-state.mjs --channel windows --input release-state.json

      # 这一步同时服务两条路径：首次公开前的绑定校验，以及「已公开但缺对端清单」
      # 的重跑。下游验签/证据/来源校验直接读取 draft-assets/，因此这里不能按
      # need_publish 跳过——否则恢复路径会在接力之前就因缺目录而失败。
      - name: Download Draft assets and verify binding
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.identity.outputs.tag }}
          COMMIT: ${{ steps.identity.outputs.commit }}
          VERSION: ${{ steps.identity.outputs.version }}
          NEED_PUBLISH: ${{ steps.state.outputs.need_publish }}
        run: |
          set -euo pipefail
          rm -rf draft-assets && mkdir -p draft-assets
          gh release download "$TAG" --dir draft-assets --clobber
          if [ ! -f draft-assets/rc-record.json ]; then
            echo "Draft 缺少 rc-record.json：无法确认制品摘要，拒绝发布" >&2
            exit 1
          fi
          if [ ! -f draft-assets/install-verification.json ]; then
            echo "缺少干净 Windows VM 的安装验证回执 install-verification.json：正式发布强制条件未满足，拒绝发布" >&2
            exit 1
          fi
          # 已公开 Release 会带接力清单；只在重跑复核时允许它，首次公开的 Draft 不得夹带。
          ALLOW_EXTRA=()
          if [ "$NEED_PUBLISH" != "true" ]; then
            ALLOW_EXTRA+=(--allow-extra latest-linux-critical.json)
          fi
          node scripts/release-governance/verify-draft.mjs \
            --tag "$TAG" \
            --channel windows \
            --commit "$COMMIT" \
            --record draft-assets/rc-record.json \
            --assets-dir draft-assets \
            --attestation draft-assets/install-verification.json \
            --manifest draft-assets/latest.json \
            --platform windows-x86_64 \
            "${ALLOW_EXTRA[@]}"
          # 固化审批时看到的两份治理文件；发布前复检必须与这份快照逐字节一致。
          rm -rf approved && mkdir -p approved
          cp draft-assets/rc-record.json draft-assets/install-verification.json approved/

      # ---------- 强制验收：签名验证 + 真实安装/升级验证 ----------
      # 缺少任一证据、证据过期、版本/Commit/制品哈希/平台不一致，全部拒绝发布。
      # 这三步没有开关：不能通过参数、状态文件或跳过 Job 绕过。
      - name: Fetch pinned minisign (official, digest-verified)
        shell: bash
        run: node scripts/release-governance/fetch-minisign.mjs

      - name: Verify candidate artifact signature
        shell: bash
        env:
          TAG: ${{ steps.identity.outputs.tag }}
          COMMIT: ${{ steps.identity.outputs.commit }}
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf evidence && mkdir -p evidence
          # 公钥来自仓库当前配置（信任锚点），不是任何外部输入。
          node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json","utf8"));fs.writeFileSync("evidence/configured.pub",Buffer.from(c.plugins.updater.pubkey,"base64"));'
          # 显式唯一解析安装包与签名：0 个或多个都失败并说明原因。
          # 不用 `ls ... | head -1`：它在 set -euo pipefail 下无匹配会直接退出，
          # 后面的空串判断执行不到，用户只会看到 ls 的原始报错。
          INSTALLER="$(node scripts/release-governance/resolve-draft-asset.mjs \
            --dir draft-assets --pattern '*.exe' --label 安装包)"
          SIGNATURE="$(node scripts/release-governance/resolve-draft-asset.mjs \
            --dir draft-assets --pattern '*.exe.sig' --label 签名文件)"
          node scripts/release-governance/verify-signature.mjs \
            --artifact "$INSTALLER" \
            --signature "$SIGNATURE" \
            --public-key evidence/configured.pub \
            --version "$VERSION" \
            --commit "$COMMIT" \
            --platform windows-x86_64 \
            --out evidence/signature-verification.json

      - name: Verify release evidence (signature + install/upgrade)
        shell: bash
        env:
          TAG: ${{ steps.identity.outputs.tag }}
          COMMIT: ${{ steps.identity.outputs.commit }}
        run: |
          set -euo pipefail
          if [ ! -f draft-assets/install-verification.json ]; then
            echo "缺少 install-verification.json：干净环境的真实安装/升级/数据完整性验证是发布的强制条件" >&2
            exit 1
          fi
          node scripts/release-governance/verify-evidence.mjs \
            --record draft-assets/rc-record.json \
            --assets-dir draft-assets \
            --signature-evidence evidence/signature-verification.json \
            --install-evidence draft-assets/install-verification.json \
            --public-key evidence/configured.pub \
            --channel windows \
            --commit "$COMMIT"

      # 干净环境不能只是 cleanEnvironment=true 的声明：
      # - GitHub-hosted 证据必须能追溯到一次真实成功、由 workflow_dispatch 触发、
      #   跑在 main 上的 run，且证据时间落在 run 执行窗口内；
      # - 本地 VM 证据一律拒绝（与 Linux 通道一致）：自述的镜像/主机信息无法
      #   在线核验，不能替代 hosted 干净 VM 的真实安装证据。
      - name: Verify clean-VM provenance
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/release-governance/verify-provenance.mjs \
            --evidence draft-assets/install-verification.json \
            --repo "${GITHUB_REPOSITORY}" \
            --expected-workflow ".github/workflows/release-install-verify.yml" \
            --require-github-actions \
            --out evidence/provenance-verification.json

      # 只读审计：记录本次发布的触发者与 Environment 审批人。
      # 当前 release-windows 允许 self-review（prevent_self_review=false），
      # 因此 AI 与维护者共用身份时无法靠技术区分；这里只把风险写进日志与
      # job summary，不改变现有审批结构、不阻断发布。
      - name: Audit deployment approval boundary
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/approvals" > approvals.json || true
          node - <<'NODE'
          const fs = require("node:fs");
          let approvals = [];
          try { approvals = JSON.parse(fs.readFileSync("approvals.json", "utf8")); } catch {}
          const approvers = [...new Set((Array.isArray(approvals) ? approvals : [])
            .filter((entry) => entry.state === "approved")
            .map((entry) => entry.user?.login)
            .filter(Boolean))];
          const actor = process.env.GITHUB_ACTOR || "(unknown)";
          const same = approvers.includes(actor);
          const lines = [
            "### Release approval boundary",
            "",
            `- Run actor: \`${actor}\``,
            `- Deployment approvers: \`${approvers.join(", ") || "(none read)"}\``,
            `- Same identity self-review: \`${same ? "YES — process-only separation" : "no"}\``,
            "",
            "当前 Environment 允许 self-review；若 actor 与 approver 相同，AI 与维护者共用身份时无法技术区分。",
            "要获得技术隔离，请维护者配置 GitHub App/第二账号审批身份（见维护者本地发布审批文档）。",
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join("\n")}\n`);
          console.log(lines.join("\n"));
          if (approvers.length === 0) {
            console.log("::warning::未读取到 deployment approval 记录，请人工确认 Environment 审批存在");
          }
          if (same) {
            console.log("::warning::触发者与审批人是同一账号；当前仅靠流程约束区分 AI 与维护者");
          }
          NODE

      # ---------- 公开说明门禁 ----------
      # 公开 Release 必须给出双语说明（英文完整版在前、简体中文在后、3–5 条更新），
      # 且不得包含 QA 计数、CI run、PR/Issue 号、commit/hash、CSP 或迁移内部细节。
      # 说明随 Draft 一起被审批，因此这里校验的是**即将公开的那份正文**。
      # latest.json 的 notes 会直接显示在应用更新弹窗里，且由候选阶段生成，
      # 可能与后来手工改过的 Draft 正文不同步，因此单独再校验一次。
      - name: Enforce bilingual release notes
        if: steps.state.outputs.need_publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.identity.outputs.tag }}
        run: |
          set -euo pipefail
          # --jq 会额外追加 LF；快照将作为 --notes-file 回写，必须保留原始正文的字节。
          gh release view "$TAG" --json body --template '{{.body}}' > draft-release-notes.md
          node scripts/release-governance/release-notes.mjs --check draft-release-notes.md
          # 更新弹窗显示的是清单 notes，不是 Release 正文。结构与内部信息仍是硬门禁；
          # 正文与清单必须一致；修改说明时须重跑候选。
          gh release download "$TAG" --pattern latest.json --dir pre-publish-notes --clobber
          node scripts/release-governance/release-notes.mjs \
            --check-manifest pre-publish-notes/latest.json \
            --require-match draft-release-notes.md
          # 固化审批时看到的正文与摘要；发布时直接使用这份正文，发布前后都必须一致。
          cp draft-release-notes.md approved/release-notes.md
          node -e 'const fs=require("node:fs");const {sha256File}=require("./scripts/release-governance/rc-record.mjs");fs.writeFileSync("approved/release-notes.sha256",`${sha256File("approved/release-notes.md")}\n`)'

      # 审批之后、写入之前的竞态门禁：
      # - 标签仍存在且仍指向同一个候选提交（v* 标签由仓库规则禁止更新/删除）；
      # - 目标仍是 Draft，target_commitish 仍是同一个完整 SHA；
      # - 重新下载全部 Draft 制品，rc-record / 安装回执未变化，且每个制品摘要仍与记录一致。
      # 这样审批时看到的资产与实际要公开的资产是同一组。
      - name: Re-check tag and Draft identity before publish
        if: steps.state.outputs.need_publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.identity.outputs.tag }}
          COMMIT: ${{ steps.identity.outputs.commit }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json isDraft,tagName,targetCommitish > release-recheck.json
          node scripts/release-governance/publish-identity.mjs \
            --tag "$TAG" \
            --channel windows \
            --release-json release-recheck.json \
            --record approved/rc-record.json \
            --out release-recheck-identity.json
          RECHECK_COMMIT="$(node -p 'JSON.parse(require("node:fs").readFileSync("release-recheck-identity.json","utf8")).commit')"
          if [ "$RECHECK_COMMIT" != "$COMMIT" ]; then
            echo "复检得到的候选提交 $RECHECK_COMMIT 与审批身份 $COMMIT 不一致，拒绝发布" >&2
            exit 1
          fi
          rm -rf publish-recheck && mkdir -p publish-recheck
          gh release download "$TAG" --dir publish-recheck --clobber
          node -e '
            const { sha256File } = require("./scripts/release-governance/rc-record.mjs");
            for (const name of ["rc-record.json", "install-verification.json"]) {
              const before = sha256File(`approved/${name}`);
              const after = sha256File(`publish-recheck/${name}`);
              if (before !== after) {
                console.error(`${name} 在校验与发布之间发生变化，拒绝发布`);
                process.exit(1);
              }
            }
          '
          # 正文也可能在上一次检查后被改写；发布前再取一次，先比对审批摘要再校验结构。
          gh release view "$TAG" --json body --template '{{.body}}' > release-recheck-notes.md
          node -e '
            const fs = require("node:fs");
            const { sha256File } = require("./scripts/release-governance/rc-record.mjs");
            const before = fs.readFileSync("approved/release-notes.sha256", "utf8").trim();
            const after = sha256File("release-recheck-notes.md");
            if (before !== after) {
              console.error("Release 正文在校验与发布之间发生变化，拒绝发布");
              process.exit(1);
            }
          '
          node scripts/release-governance/release-notes.mjs --check release-recheck-notes.md
          node scripts/release-governance/release-notes.mjs \
            --check-manifest publish-recheck/latest.json \
            --require-match release-recheck-notes.md
          node scripts/release-governance/verify-draft.mjs \
            --tag "$TAG" \
            --channel windows \
            --commit "$COMMIT" \
            --record publish-recheck/rc-record.json \
            --assets-dir publish-recheck \
            --attestation publish-recheck/install-verification.json \
            --manifest publish-recheck/latest.json \
            --platform windows-x86_64

      - name: Publish the Draft
        if: steps.state.outputs.need_publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.identity.outputs.tag }}
        run: |
          set -euo pipefail
          # 标签必须已由维护者按授权流程创建；--tag 让 --verify-tag 真正检查远端标签，
          # 防止标签在复检后被删除时 GitHub 在这里用 target_commitish 顺带创建它。
          gh release edit "$TAG" --tag "$TAG" --draft=false --verify-tag \
            --title "Moyu $TAG" --notes-file approved/release-notes.md

      # 幂等接力：缺才补。已公开的 Release 也允许补——这是部分失败的唯一自救路径，
      # 且只新增"另一通道清单"这一个资产，不会重新公开、不会改写其它资产。
      - name: Channel hand-off (carry the other channel manifest)
        if: steps.state.outputs.need_handoff == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.identity.outputs.tag }}
        run: |
          set -euo pipefail
          # 接力只发生在已公开的 Release 上：Draft 阶段补齐由候选流程负责。
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "false" ]; then
            echo "Release $TAG 仍未公开：拒绝在 Draft 上执行通道接力" >&2
            exit 1
          fi
          # 本次发布会成为最新 release：必须带上 Linux 高危通道的清单，
          # 否则 releases/latest/download/latest-linux-critical.json 会 404。
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx 'latest-linux-critical.json'; then
            echo "已包含 latest-linux-critical.json"
            exit 0
          fi
          mkdir -p handoff
          # 只从**已公开且非预发布**的 Release 接力另一通道清单：Draft（包括
          # 另一通道尚未审批的候选）不可作为来源，否则会把未审批的清单带上
          # 公开 Release，绕过该通道的人工审批。
          for PREV in $(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name'); do
            if [ "$PREV" = "$TAG" ]; then continue; fi
            rm -rf handoff && mkdir -p handoff
            if gh release download "$PREV" -p latest-linux-critical.json -p rc-record.json -D handoff --clobber 2>/dev/null; then
              # 接力的清单必须能绑定到源 Release 自己的 RC 记录；不接受未经摘要绑定的字节。
              # 退出码 2 = 该 Release 不是这个对端通道（继续找下一个），1 = 摘要/记录异常（失败关闭）。
              set +e
              node scripts/release-governance/verify-peer-manifest.mjs \
                --record handoff/rc-record.json \
                --manifest handoff/latest-linux-critical.json \
                --channel linux-critical \
                --name latest-linux-critical.json \
                --out handoff/peer-expected.json
              STATUS=$?
              set -e
              if [ "$STATUS" -eq 2 ]; then continue; fi
              if [ "$STATUS" -ne 0 ]; then exit 1; fi
              gh release upload "$TAG" handoff/latest-linux-critical.json --clobber
              cp handoff/peer-expected.json peer-expected.json
              echo "已从 ${PREV} 接力 latest-linux-critical.json"
              # 上传后立刻确认资产真的在，避免"命令返回 0 但资产未落地"。
              if ! gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx 'latest-linux-critical.json'; then
                echo "接力后仍未见 latest-linux-critical.json" >&2
                exit 1
              fi
              exit 0
            fi
          done
          echo "未找到可接力的 latest-linux-critical.json：Linux 通道清单必须存在，否则公开下载会 404" >&2
          exit 1

      # 最终判据：公开状态 + 两条通道的清单都必须存在且可下载。
      # 不使用 always()：上游任一环节失败时本步骤跳过，工作流保持红色，
      # 不会出现"失败但打印成功摘要"的假绿灯。
      - name: Post-release verification
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.identity.outputs.tag }}
          COMMIT: ${{ steps.identity.outputs.commit }}
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          IS_DRAFT="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
          if [ "$IS_DRAFT" != "false" ]; then
            echo "发布后仍是 Draft：发布未生效" >&2
            exit 1
          fi
          rm -rf published && mkdir -p published
          gh release download "$TAG" --dir published --clobber
          # 已公开正文也必须与审批时一致（仅首次公开的本次运行有审批摘要）。
          if [ -f approved/release-notes.sha256 ]; then
            gh release view "$TAG" --json body --template '{{.body}}' > published-notes.md
            node -e '
              const fs = require("node:fs");
              const { sha256File } = require("./scripts/release-governance/rc-record.mjs");
              const before = fs.readFileSync("approved/release-notes.sha256", "utf8").trim();
              const after = sha256File("published-notes.md");
              if (before !== after) {
                console.error("已公开 Release 正文与审批快照不一致，发布失败");
                process.exit(1);
              }
            '
          fi
          # 本次接力写入的对端清单也必须保持摘要不变。
          if [ -f peer-expected.json ]; then
            node -e '
              const fs = require("node:fs");
              const { sha256File } = require("./scripts/release-governance/rc-record.mjs");
              const expected = JSON.parse(fs.readFileSync("peer-expected.json", "utf8"));
              const actual = sha256File(`published/${expected.name}`);
              if (actual !== expected.sha256) {
                console.error(`${expected.name} 与接力时的源摘要不一致，发布失败`);
                process.exit(1);
              }
            '
          fi
          # 发布后再次绑定：标签仍指向同一候选提交，公开后的记录/回执必须与审批快照
          # 逐字节一致（防止在复检与发布之间连同记录一起替换），再校验全部制品。
          gh release view "$TAG" --json isDraft,tagName,targetCommitish > published-release.json
          node scripts/release-governance/publish-identity.mjs \
            --tag "$TAG" \
            --channel windows \
            --release-json published-release.json \
            --record published/rc-record.json \
            --out published-identity.json
          node -e '
            const { sha256File } = require("./scripts/release-governance/rc-record.mjs");
            for (const name of ["rc-record.json", "install-verification.json"]) {
              const before = sha256File(`approved/${name}`);
              const after = sha256File(`published/${name}`);
              if (before !== after) {
                console.error(`${name} 与审批快照不一致：公开资产被替换，发布失败`);
                process.exit(1);
              }
            }
          '
          node scripts/release-governance/verify-draft.mjs \
            --tag "$TAG" \
            --channel windows \
            --commit "$COMMIT" \
            --record published/rc-record.json \
            --assets-dir published \
            --attestation published/install-verification.json \
            --manifest published/latest.json \
            --platform windows-x86_64 \
            --allow-extra latest-linux-critical.json
          node scripts/verify-updater-manifest.mjs published/latest.json \
            --expect-version "$VERSION" \
            --require-platform windows-x86_64
          # 公开更新清单必须真的可下载（Windows 通道端点）。
          curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.json" -o published/public-latest.json
          node scripts/verify-updater-manifest.mjs published/public-latest.json \
            --expect-version "$VERSION" \
            --require-platform windows-x86_64
          # 另一通道的清单也必须在本 Release 里，且能从 latest 端点下载。
          # 版本号允许与本通道不同（另一通道可能尚未发布同一版本），只校验平台。
          if ! gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx 'latest-linux-critical.json'; then
            echo "缺少 latest-linux-critical.json：Linux 更新端点会 404" >&2
            exit 1
          fi
          curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest-linux-critical.json" -o published/public-peer.json
          node scripts/verify-updater-manifest.mjs published/public-peer.json \
            --require-platform linux-x86_64

      - name: Summarize publication
        if: success()
        shell: bash
        env:
          TAG: ${{ steps.identity.outputs.tag }}
          COMMIT: ${{ steps.identity.outputs.commit }}
          PUBLISHED_NOW: ${{ steps.state.outputs.need_publish }}
        run: |
          {
            echo "### 发布结果（Windows）"
            echo ""
            echo "- Tag: \`${TAG}\`"
            echo "- Commit: \`${COMMIT}\`"
            echo "- 状态：${{ steps.state.outputs.need_publish == 'true' && '本次公开' || '此前已公开（本次只补齐/复核清单）' }}"
          } >> "$GITHUB_STEP_SUMMARY"
