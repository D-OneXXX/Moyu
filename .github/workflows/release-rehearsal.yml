name: Release governance rehearsal

# Phase 4 发布链路的**隔离演练**：
# - 不联网发布、不创建任何 Release、不接触任何 Secret；
# - 用进程内假后端跑通「候选 → Draft → 审批绑定 → 发布 → 失败恢复 → 并发 → 清单安全」；
# - 同时跑发布治理单元测试。
#
# 任何一项失败都会让本工作流变红：发布状态机回归必须立刻可见。
on:
  # 只在改动触碰发布链路时才演练：纯前端/后端 PR 不必等一遍发布状态机。
  # 这里没有必需检查（分支保护只要求 4 个上下文），所以 paths 过滤不会
  # 制造"Expected 永不满足"的死锁——需要时仍可手动 workflow_dispatch。
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/release-*"
      - "scripts/release-governance/**"
      - "scripts/release-smoke/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-rehearsal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rehearsal:
    name: Release governance rehearsal (no secrets)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Release governance unit tests
        run: node --test scripts/release-governance/rc-record.test.mjs

      - name: Isolated release rehearsal
        env:
          REHEARSAL_OUT_DIR: rehearsal
        run: node scripts/release-governance/rehearse.mjs --json

      - name: Upload rehearsal report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-rehearsal-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: rehearsal/rehearsal.json
